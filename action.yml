name: PrivTrace compliance gate
description: >
  Scan the repository against the compliance packs your business picked (DPDP, CERT-In, IT Act,
  GDPR subset, security baseline), compare with the base branch, post a sticky PR comment with
  copy-paste AI fix prompts, and fail the check when the gate fails. Findings are engineering
  evidence, not legal advice. With AI off (the default) no code leaves the runner.
author: PrivTrace
branding:
  icon: shield
  color: purple

inputs:
  config:
    description: Path to .privtrace.yml
    default: .privtrace.yml
  working-directory:
    description: Folder to scan (the repository root by default)
    default: .
  packs:
    description: Override the packs from the config (comma-separated)
    default: ""
  min-score:
    description: Override gate.min_score
    default: ""
  fail-on:
    description: Override gate.fail_on_severity (critical|high|medium|low|none)
    default: ""
  base:
    description: >
      Git ref to compare against. Default: the PR's base branch (origin/<base_ref>) on pull_request,
      otherwise the committed baseline file if present. Needs actions/checkout with fetch-depth: 0.
    default: ""
  gemini-api-key:
    description: Optional. Only used when the config sets ai.enabled true.
    default: ""
  gemini-model:
    description: Optional Gemini model id (with gemini-api-key)
    default: ""
  comment:
    description: Post / update one sticky PR comment
    default: "true"
  output-dir:
    description: Where reports are written
    default: privtrace-report
  python-version:
    description: Python used to run PrivTrace
    default: "3.12"
  upload-url:
    description: >
      Optional PrivTrace server to send the code-free result to, for the CI history view
      (e.g. https://privtrace-836138728232.asia-south1.run.app). Empty = no upload.
    default: ""
  upload-token:
    description: Upload token (the server's PRIVTRACE_CI_TOKEN), from a secret
    default: ""
  github-token:
    description: Token used to post the PR comment
    default: ${{ github.token }}

outputs:
  passed:
    description: "'true' if the gate passed"
    value: ${{ steps.scan.outputs.passed }}
  exit-code:
    description: 0 passed, 1 gate failed, 2 config or scan error
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path to the SARIF file (upload with github/codeql-action/upload-sarif)
    value: ${{ steps.scan.outputs.sarif-file }}
  report-dir:
    description: Folder with report.html, privtrace.json, comment.md (upload with actions/upload-artifact)
    value: ${{ steps.scan.outputs.report-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install PrivTrace
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "${{ github.action_path }}/backend"

    - name: Run the PrivTrace gate
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PRIVTRACE_PACKS_DIR: ${{ github.action_path }}/packs
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GEMINI_MODEL: ${{ inputs.gemini-model }}
        IN_CONFIG: ${{ inputs.config }}
        IN_PACKS: ${{ inputs.packs }}
        IN_MIN_SCORE: ${{ inputs.min-score }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_BASE: ${{ inputs.base }}
        IN_UPLOAD: ${{ inputs.upload-url }}
        PRIVTRACE_TOKEN: ${{ inputs.upload-token }}
        OUT: ${{ github.workspace }}/${{ inputs.output-dir }}
      run: |
        set +e
        mkdir -p "$OUT"
        args=(ci . --json "$OUT/privtrace.json" --sarif "$OUT/privtrace.sarif" --markdown "$OUT/comment.md"
              --html "$OUT/report.html"
              --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts")
        if [ -f "$IN_CONFIG" ]; then args+=(--config "$IN_CONFIG"); fi
        if [ -n "$IN_PACKS" ]; then args+=(--packs "$IN_PACKS"); fi
        if [ -n "$IN_MIN_SCORE" ]; then args+=(--min-score "$IN_MIN_SCORE"); fi
        if [ -n "$IN_FAIL_ON" ]; then args+=(--fail-on "$IN_FAIL_ON"); fi
        if [ -n "$IN_UPLOAD" ]; then args+=(--upload "$IN_UPLOAD"); fi
        base="$IN_BASE"
        if [ -z "$base" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
          base="origin/$GITHUB_BASE_REF"
        fi
        if [ -n "$base" ]; then
          if git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            args+=(--base "$base")
          else
            echo "::warning::PrivTrace: base ref $base not found (use actions/checkout with fetch-depth: 0); comparing with the committed baseline if present."
          fi
        fi
        privtrace "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "passed=$([ "$code" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "report-dir=$OUT" >> "$GITHUB_OUTPUT"
        if [ -f "$OUT/privtrace.sarif" ]; then echo "sarif-file=$OUT/privtrace.sarif" >> "$GITHUB_OUTPUT"; fi
        if [ "$code" = 2 ]; then echo "::error::PrivTrace could not run (config or scan error). See the log above."; fi
        exit 0  # the last step fails the job, after the comment is posted

    - name: Post or update the PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.scan.outputs.exit-code != '2'
      uses: actions/github-script@v7
      continue-on-error: true  # e.g. PRs from forks have a read-only token
      env:
        COMMENT_FILE: ${{ steps.scan.outputs.report-dir }}/comment.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const path = process.env.COMMENT_FILE;
          if (!fs.existsSync(path)) { core.info("no comment file"); return; }
          const body = fs.readFileSync(path, "utf8");
          const marker = "<!-- privtrace-gate -->";
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.startsWith(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            core.info(`updated comment ${mine.id}`);
          } else {
            const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`created comment ${data.id}`);
          }

    - name: Gate result
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "PrivTrace gate passed." ;;
          1) echo "::error::PrivTrace gate failed: see the PR comment or job summary."; exit 1 ;;
          *) echo "::error::PrivTrace did not complete (exit $CODE)."; exit 2 ;;
        esac
