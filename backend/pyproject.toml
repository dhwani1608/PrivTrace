[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "privtrace"
version = "0.1.0"
description = "Multi-framework compliance scanner for codebases (DPDP, IT Act, CERT-In, GDPR, security baseline)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "google-genai>=1.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
privtrace = "privtrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["privtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
