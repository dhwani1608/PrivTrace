# EU General Data Protection Regulation (Regulation (EU) 2016/679) — the code-relevant subset.
id: gdpr-subset
name: GDPR (EU) — code-relevant subset
short_name: GDPR
jurisdiction: EU
version: "2016/679"
source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
description: >
  The GDPR obligations that show up in code: erasure, minimisation, storage limitation,
  security of processing, processors and international transfers, plus checklist items
  for breach notification, records of processing and DPO.

rules:
  - id: GDPR-ERA-01
    title: Erasure does not reach every store holding personal data
    reference: "GDPR Art. 17 (right to erasure)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: critical
    check_type: automated
    detector: erasure_covers_all_stores
    why_it_matters: An erasure request must remove the person's data from every place you hold it, including caches and vector stores.
    remediation: Make the delete handler erase from every store in the data-flow map, and test it.
    tags: [erasure, rights]

  - id: GDPR-MIN-01
    title: Sensitive identifiers collected — confirm necessity
    reference: "GDPR Art. 5(1)(c) (data minimisation)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: medium
    check_type: automated
    detector: minimisation_sensitive_fields
    why_it_matters: Personal data must be adequate, relevant and limited to what is necessary.
    remediation: Remove or make optional the fields not needed for the purpose.
    tags: [minimisation]

  - id: GDPR-RET-01
    title: Personal data cached with no expiry
    reference: "GDPR Art. 5(1)(e) (storage limitation)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: medium
    check_type: automated
    detector: cache_pii_without_ttl
    why_it_matters: Data must not be kept longer than necessary; cache entries without TTL live forever.
    remediation: Set a TTL on every cache write holding personal data.
    tags: [retention]

  - id: GDPR-RET-02
    title: Retention / purge mechanism for stored personal data
    reference: "GDPR Art. 5(1)(e) (storage limitation)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: medium
    check_type: hybrid
    detector: retention_mechanism_present
    question: Do you have defined retention periods and delete personal data when they end?
    why_it_matters: Storage limitation requires deleting or anonymising data once it is no longer needed.
    remediation: Define retention periods and add scheduled purge jobs or storage lifecycle rules.
    tags: [retention]

  - id: GDPR-SEC-01
    title: Personal data sent to an AI provider without redaction
    reference: "GDPR Art. 25 (data protection by design) and Art. 32 (security of processing)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: automated
    detector: pii_to_llm_unredacted
    why_it_matters: Pseudonymising data before sending it to a processor is a standard by-design measure.
    remediation: Redact or pseudonymise identifiers before building prompts.
    tags: [ai, security]

  - id: GDPR-SEC-02
    title: Personal data written to logs
    reference: "GDPR Art. 32 (security of processing)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: automated
    detector: pii_in_logs
    why_it_matters: Logs spread personal data to systems and people who don't need it.
    remediation: Log IDs not values and add a redacting log filter.
    tags: [logging, security]

  - id: GDPR-SEC-03
    title: Passwords stored without hashing
    reference: "GDPR Art. 32 (security of processing)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: critical
    check_type: automated
    detector: plaintext_passwords
    why_it_matters: Plaintext passwords turn any leak into account takeovers elsewhere.
    remediation: Hash with bcrypt/argon2.
    tags: [credentials, security]

  - id: GDPR-CON-01
    title: Lawful basis / consent recorded at collection
    reference: "GDPR Art. 6 (lawfulness) and Art. 7 (conditions for consent)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: hybrid
    detector: consent_captured_at_collection
    question: For each kind of personal data you collect, have you identified a lawful basis, and where it is consent, can you demonstrate it was given?
    why_it_matters: Where processing relies on consent, the controller must be able to demonstrate it.
    remediation: Record the lawful basis per purpose; store consent records with timestamp and notice version.
    tags: [consent]

  - id: GDPR-TRF-01
    title: Personal data shared with third parties (processors / transfers)
    reference: "GDPR Art. 28 (processors) and Art. 44 (general principle for transfers)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: automated
    detector: pii_to_third_party
    detector_params: {hit_status: needs_review}
    why_it_matters: Third-party APIs are processors and often process data outside the EEA.
    remediation: Inventory recipients, sign DPAs, and confirm a transfer mechanism for non-EEA recipients.
    tags: [third-party, transfers]

  - id: GDPR-TRF-02
    title: Transfer mechanism for data leaving the EEA
    reference: "GDPR Art. 44–46 (adequacy decisions, appropriate safeguards)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: manual
    question: For personal data transferred outside the EEA (e.g. to an LLM API in another region), do you rely on an adequacy decision, Standard Contractual Clauses or another Chapter V mechanism?
    why_it_matters: Transfers outside the EEA need a legal mechanism.
    remediation: Document the mechanism per recipient (adequacy, SCCs + transfer impact assessment).
    tags: [transfers]

  - id: GDPR-PRC-01
    title: Data processing agreements with processors
    reference: "GDPR Art. 28(3) (contract with processor)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: manual
    question: Do you have a data processing agreement with every processor (cloud, LLM API, analytics, email/SMS) that handles personal data?
    why_it_matters: Processing by a processor must be governed by a contract with mandatory terms.
    remediation: Sign DPAs with each vendor; most providers offer a standard DPA.
    tags: [processors]

  - id: GDPR-BRE-01
    title: Breach notification within 72 hours
    reference: "GDPR Art. 33 (notification to the supervisory authority) and Art. 34 (communication to data subjects)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: high
    check_type: manual
    question: Can you notify the supervisory authority within 72 hours of becoming aware of a personal data breach, and inform affected people where required?
    why_it_matters: The 72-hour deadline needs a prepared process.
    remediation: Maintain an incident runbook with breach assessment and notification templates.
    tags: [breach]

  - id: GDPR-ROPA-01
    title: Records of processing activities
    reference: "GDPR Art. 30 (records of processing activities)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: medium
    check_type: manual
    question: Do you maintain records of processing activities (purposes, categories of data and recipients, transfers, retention, security measures)?
    why_it_matters: Records of processing are the basis for demonstrating accountability. PrivTrace's data-flow map can seed them.
    remediation: Create a processing register; use the data-flow map from this report as a starting point.
    tags: [governance]

  - id: GDPR-DPO-01
    title: Data Protection Officer (where required)
    reference: "GDPR Art. 37 (designation of the data protection officer)"
    reference_verified: true
    source_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    severity: low
    check_type: manual
    question: If your core activities involve large-scale monitoring or special-category data, have you designated a DPO? (Answer "yes" if a DPO is not required for you.)
    why_it_matters: Some organisations must designate a DPO.
    remediation: Assess whether Art. 37 applies; if so, designate and publish DPO contact details.
    tags: [governance]
